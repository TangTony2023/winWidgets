name: Publish to beta

on:
  workflow_dispatch:
  push:
    branches:
      - beta

jobs:
  publish:
    runs-on: windows-latest

    strategy:
      matrix:
        runtime: [ win-x86, win-x64, win-arm64 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build .\src\uWidgets.sln --configuration Release

      - name: Publish App
        run: |
          dotnet publish .\src\uWidgets\uWidgets.csproj `
          --configuration Release `
          --runtime ${{ matrix.runtime }} `
          --output .\src\uWidgets\bin\Publish\${{ matrix.runtime }} `
          --self-contained true `
          /p:PublishReadyToRun=true

      - name: Publish Widgets
        run: |
          $widgetsPath = ".\src\Widgets"
          $publishPath = ".\src\uWidgets\bin\Publish\${{ matrix.runtime }}"
          $outputPath = "$publishPath\Widgets"

          if (-not (Test-Path $outputPath)) {
            New-Item -Path $outputPath -ItemType Directory -Force
          }

          $widgetCsproj = Get-ChildItem -Path $widgetsPath -Recurse -Filter *.csproj

          foreach ($csproj in $widgetCsproj) {
            dotnet publish $csproj.FullName `
              --configuration Release `
              --runtime ${{ matrix.runtime }} `
              --output $outputPath `
              --self-contained true `
              /p:PublishReadyToRun=true
          }

          Get-ChildItem $publishPath -Filter *.pdb -Recurse | Remove-Item -Force
          Get-ChildItem $publishPath -Filter *.xml -Recurse | Remove-Item -Force
          Get-ChildItem $publishPath -Filter *.deps.json -Recurse | Remove-Item -Force
          Get-ChildItem $publishPath -Filter *.runtimeconfig -Recurse | Remove-Item -Force

      - name: Archive
        run: |
          Compress-Archive `
            -Path .\src\uWidgets\bin\Publish\${{ matrix.runtime }} `
            -DestinationPath .\src\uWidgets\bin\Publish\${{ matrix.runtime }}.zip

      # ✅ 安装 Inno Setup（只在 x64 做 installer）
      - name: Install Inno Setup
        if: ${{ matrix.runtime == 'win-x64' }}
        run: choco install innosetup -y

      # ✅ 生成 installer
      - name: Build Installer
        if: ${{ matrix.runtime == 'win-x64' }}
        run: |
          iscc installer/setup.iss

      # ✅ 上传 zip
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: publish-${{ matrix.runtime }}
          path: .\src\uWidgets\bin\Publish\${{ matrix.runtime }}.zip

      # ✅ 上传 installer
      - name: Upload installer
        if: ${{ matrix.runtime == 'win-x64' }}
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: uWidgets-Setup.exe

  release:
    runs-on: windows-latest
    needs: publish

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download publish artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: publish-*
          merge-multiple: true
          path: .\release

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: installer
          path: .\release

      # ✅ 获取版本号
      - name: Get Assembly Version
        id: version
        run: |
          $filePath = ".\src\uWidgets\AssemblyInfo.cs"
          $content = [string](Get-Content $filePath)

          if ($content -match '\[assembly: AssemblyVersion\("([0-9]+\.[0-9]+\.[0-9]+)"\)\]') {
            $version = $matches[1]
            echo "version=v$version" >> $env:GITHUB_OUTPUT
          } else {
            exit 1
          }

      - name: Create Tag
        uses: negz/create-tag@v1
        with:
          version: ${{ steps.version.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Changelog
        id: changelog
        uses: requarks/changelog-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.version.outputs.version }}

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          release_name: ${{ steps.version.outputs.version }}-beta
          body: |
            # Changelog:
            ${{ steps.changelog.outputs.changes }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ✅ 上传 zip
      - name: Upload win-x86
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: .\release\win-x86.zip
          asset_name: win-x86.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload win-x64
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: .\release\win-x64.zip
          asset_name: win-x64.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload win-arm64
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: .\release\win-arm64.zip
          asset_name: win-arm64.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ✅ 上传 installer（核心）
      - name: Upload installer exe
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: .\release\uWidgets-Setup.exe
          asset_name: uWidgets-Setup.exe
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
